[project]
name = "a2a-simple-math-agent"
version = "1.0.0"
description = "Simple math agent (addition and subtraction) agent to demonstrate A2A concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=1.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.156.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_math_agent"]
