[project]
name = "a2a-simple-math-agent"
version = "0.1.1"
description = "Simple math agent (addition and subtraction) agent to demonstrate A2A concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "google-adk>=2.4.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.147.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_math_agent"]